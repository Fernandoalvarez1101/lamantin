name: Deploy a GitHub Pages

# "on" entre comillas: evita que el parser YAML 1.1 lo interprete como
# booleano (falso positivo del yaml-language-server de VS Code). GitHub
# Actions lo acepta igual.
"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencias
        run: flutter pub get

      - name: Build web
        # IMPORTANTE: /lamantin/ debe coincidir con el NOMBRE del repositorio.
        # GitHub Pages sirve los proyectos en https://<usuario>.github.io/<repo>/
        # y Flutter necesita el base-href con esa ruta. Si el repo se llama
        # distinto, actualizar este valor (ej. /mi-repo/).
        run: flutter build web --release --base-href=/lamantin/

      - name: Subir artefacto (build/web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
